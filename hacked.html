<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacked by RedKnight</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: #ff1a1a;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    position: relative;
  }
  canvas { position: fixed; inset: 0; z-index: 0; opacity: 0.25; }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.25) 0, rgba(0,0,0,0.25) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 2;
  }
  .wrap { position: relative; z-index: 1; padding: 24px; }
  .skull { font-size: clamp(60px, 14vw, 140px); line-height: 1; filter: drop-shadow(0 0 18px #ff0000); animation: pulse 2s infinite; }
  h1 {
    margin-top: 16px;
    font-size: clamp(28px, 7vw, 72px);
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 10px #f00, 0 0 30px #f00;
    animation: glitch 2.5s infinite;
  }
  h1 span { color: #fff; }
  .tag {
    margin-top: 20px;
    font-size: clamp(16px, 3.5vw, 30px);
    color: #fff;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-top: 1px solid #f00;
    border-bottom: 1px solid #f00;
    display: inline-block;
    padding: 10px 18px;
    text-shadow: 0 0 8px #f00;
  }
  .cursor::after { content: "_"; animation: blink 1s steps(1) infinite; }
  .foot { margin-top: 28px; font-size: 14px; color: #a00; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @keyframes glitch {
    0%, 92%, 100% { transform: translate(0); text-shadow: 0 0 10px #f00, 0 0 30px #f00; }
    93% { transform: translate(-4px, 2px); text-shadow: 3px 0 #0ff, -3px 0 #f00; }
    95% { transform: translate(4px, -2px); text-shadow: -3px 0 #0ff, 3px 0 #f00; }
    97% { transform: translate(-2px, 0); }
  }
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="wrap">
  <div class="skull">&#9760;</div>
  <h1>Hacked by <span>RedKnight</span></h1>
  <div class="tag cursor">No scammer is safe</div>
  <div class="foot">// system compromised //</div>
</div>

<script>
  const c = document.getElementById("rain");
  const ctx = c.getContext("2d");
  let cols, drops;
  function resize() {
    c.width = innerWidth; c.height = innerHeight;
    cols = Math.floor(c.width / 16);
    drops = Array(cols).fill(1);
  }
  resize();
  addEventListener("resize", resize);
  const chars = "01RK#@$%&*";
  function draw() {
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#ff1a1a";
    ctx.font = "16px monospace";
    for (let i = 0; i < drops.length; i++) {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * 16, drops[i] * 16);
      if (drops[i] * 16 > c.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 50);
</script>
</body>
</html>
